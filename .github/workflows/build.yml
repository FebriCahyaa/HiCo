name: HiCo Thermal Build

on:
  pull_request:
    branches: [main]
    paths:
      - "jni/**"
      - "tools/**"
      - "tests/**"
      - "devices/**"
      - "thermal-data/**"
      - "generated-thermal/**"
      - "database/**"
      - "sources/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "jni/**"
      - "tools/**"
      - "tests/**"
      - "devices/**"
      - "thermal-data/**"
      - "generated-thermal/**"
      - "database/**"
      - "sources/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build host HiCo
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Device database is up to date
        run: python3 tools/gen_device_db.py --check

      - name: Python and thermal dataset validation
        env:
          HICOD: build/hicod
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py tools/hico_thermal/*.py tests/*.py
          python3 tests/hico_tools_test.py
          python3 tests/thermal_scope_test.py
          python3 tests/topology_test.py
          python3 tests/database_test.py
          python3 tests/scanner_test.py
          python3 tests/thermal_table_test.py
          python3 tests/unpack_test.py
          python3 tests/workflow_regression_test.py
          python3 tests/hico_collector_test.py
          python3 tools/hico_collector.py verify
          python3 tools/hico_generator.py verify
          python3 tools/hico_database.py validate database
          python3 tools/hico_database.py validate database/tables
          python3 tools/verify_webui.py
