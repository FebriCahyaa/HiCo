name: Build HiCo Thermal

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'jni/**'
      - 'module/**'
      - 'tests/**'
      - 'tools/**'
      - 'devices/**'
      - 'CMakeLists.txt'
      - 'version'
      - 'database/**'
      - 'sources/**'
      - 'webui/**'
      - 'docs/integrity/webui.sha256'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit & end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build (host, sanitizers)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Device scanner and tuning tests
        env:
          HICOD: build/hicod
        run: |
          python3 tests/scanner_test.py
          python3 tests/thermal_scope_test.py

      - name: Device database is up to date
        run: python3 tools/gen_device_db.py --check

      - name: Thermal tool suite
        env:
          HICOD: build/hicod
        run: |
          python3 tests/hico_tools_test.py
          python3 tests/thermal_scope_test.py
          python3 tests/topology_test.py
          python3 tests/database_test.py
          python3 tools/hico_database.py validate database
          python3 tools/verify_webui.py

      - name: ShellCheck
        run: shellcheck -s sh module/*.sh tests/cli_test.sh

  build:
    name: Build Flashable Zip
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun for thermal Monitor WebUI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Compile thermal Monitor WebUI
        working-directory: webui
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f ../module/webroot/index.html

      - name: Build module
        id: compileZip
        uses: ./.github/actions/build-module

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: hico-build
          path: ${{ steps.compileZip.outputs.zips }}
