name: Update Xiaomi device profiles

# Reads the stock vendor partition of every Xiaomi firmware dump on
# dumps.tadiphone.dev and regenerates devices/xiaomi/*.prop and docs/DEVICES.md
# (tools/xiaomi_devices.py), then compiles them into hicod's device table
# jni/src/XiaomiDevices.gen.cpp (tools/gen_device_db.py). Changes are proposed
# as a pull request, never pushed directly, so every record is reviewed
# before it is compiled into a release.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sparse: partial-clone each dump, check out only build.prop + vendor thermal files; api: read those files one by one through the GitLab API'
        type: choice
        options: [sparse, api]
        default: sparse
      limit:
        description: 'Scan at most N dumps (empty = all)'
        required: false
  schedule:
    - cron: '17 3 1 * *' # monthly

concurrency:
  group: devices
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scanner tests
        run: python3 tests/scanner_test.py

      - name: Scan dumps
        env:
          LIMIT: ${{ inputs.limit }}
          MODE: ${{ inputs.mode || 'sparse' }}
        run: |
          flags=()
          [ "$MODE" = sparse ] && flags+=(--sparse --workdir "$RUNNER_TEMP")
          [ -n "$LIMIT" ] && flags+=(--limit "$LIMIT")
          python3 tools/xiaomi_devices.py --gitlab https://dumps.tadiphone.dev --group dumps/xiaomi --jobs 6 "${flags[@]}"

      - name: Compile the device database
        run: |
          python3 tools/gen_device_db.py
          # The generated table must build and pass the tests before it is proposed.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain devices docs jni/src/XiaomiDevices.gen.cpp)" ]; then
            echo "Device profiles are up to date"
            exit 0
          fi
          count=$(find devices/xiaomi -name '*.prop' | wc -l)
          # One new branch per run, always based on the current default branch.
          # Re-pushing an older branch fails: GITHUB_TOKEN may not update a ref
          # when that changes workflow files (the old branch predates them).
          branch="devices/xiaomi-$(date +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          base="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add devices docs/DEVICES.md jni/src/XiaomiDevices.gen.cpp
          git commit -m "feat(devices): update Xiaomi device profiles ($count devices)"
          git push origin "$branch"

          url=$(gh pr create --head "$branch" --base "$base" \
            --title "Update Xiaomi device profiles ($count devices)" \
            --body "Generated by \`tools/xiaomi_devices.py\` from the stock vendor partitions on https://dumps.tadiphone.dev/dumps/xiaomi, compiled into \`jni/src/XiaomiDevices.gen.cpp\` by \`tools/gen_device_db.py\` (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Each record's \`source\` line links to the dump it was read from.") || {
            echo "::error::Could not open the pull request. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/new/$branch"
            exit 1
          }
          echo "Opened $url"

          # Older device PRs are superseded by this one.
          gh pr list --state open --base "$base" --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"devices/xiaomi-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by $url" || echo "::warning::could not close #$old"
            done || echo "::warning::could not list older device pull requests"
