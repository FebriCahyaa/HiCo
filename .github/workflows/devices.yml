name: Update Xiaomi device profiles

# Reads the stock vendor partition of every Xiaomi firmware dump on
# dumps.tadiphone.dev and regenerates devices/xiaomi/*.prop and docs/DEVICES.md
# (tools/xiaomi_devices.py). Changes are proposed as a pull request, never
# pushed directly, so every profile is reviewed before it ships.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sparse: partial-clone each dump, check out only build.prop + vendor thermal files; api: read those files one by one through the GitLab API'
        type: choice
        options: [sparse, api]
        default: sparse
      limit:
        description: 'Scan at most N dumps (empty = all)'
        required: false
  schedule:
    - cron: '17 3 1 * *' # monthly

concurrency:
  group: devices
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scanner tests
        run: python3 tests/scanner_test.py

      - name: Scan dumps
        env:
          LIMIT: ${{ inputs.limit }}
          MODE: ${{ inputs.mode || 'sparse' }}
        run: |
          flags=()
          [ "$MODE" = sparse ] && flags+=(--sparse --workdir "$RUNNER_TEMP")
          [ -n "$LIMIT" ] && flags+=(--limit "$LIMIT")
          python3 tools/xiaomi_devices.py --gitlab https://dumps.tadiphone.dev --group dumps/xiaomi --jobs 6 "${flags[@]}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain devices docs)" ]; then
            echo "Device profiles are up to date"
            exit 0
          fi
          count=$(find devices/xiaomi -name '*.prop' | wc -l)
          branch="devices/xiaomi-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add devices docs/DEVICES.md
          git commit -m "feat(devices): update Xiaomi device profiles ($count devices)"
          git push -f origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The open pull request for $branch was updated"
            exit 0
          fi
          gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
            --title "Update Xiaomi device profiles ($count devices)" \
            --body "Generated by \`tools/xiaomi_devices.py\` from the stock vendor partitions on https://dumps.tadiphone.dev/dumps/xiaomi. Each profile's \`source\` line links to the dump it was read from." || {
            echo "::error::Could not open the pull request. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/new/$branch"
            exit 1
          }
