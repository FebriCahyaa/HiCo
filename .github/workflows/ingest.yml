name: HiCo Thermal Ingest (delta only)

# The dataset in stock/ is seeded once from a developer machine:
#     python3 tools/ingest/list_device_repos.py
#     python3 tools/ingest/sparse_fetch.py --all --jobs 24
# and committed. This workflow never bulk-downloads: it re-lists the sources
# (metadata only), asks upstream which repositories actually moved
# (tools/ingest/diff_manifests.py: pushed_at first, then one `git ls-remote`
# per candidate, no clone), fetches only those, and opens one pull request.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated source ids (blank = all)"
        required: false
        default: ""
      force:
        description: "refetch every repository even if unchanged"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0" # weekly, Sunday 03:17 UTC

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    name: Discover changed repositories
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.diff.outputs.sources }}
      device_count: ${{ steps.diff.outputs.device_count }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Verify sources.yaml (informational)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          python3 tools/verify/rom_sources.py --sources stock/sources.yaml \
            || echo "::warning::A source failed verification; its committed manifest is kept (see log)."

      - name: Re-list repositories (metadata only)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TADIPHONE_TOKEN: "${{ secrets.TADIPHONE_TOKEN }}"
          ONLY: "${{ inputs.only }}"
        run: python3 tools/ingest/list_device_repos.py --only "$ONLY"

      - name: Ask upstream what moved
        id: diff
        env: { ONLY: "${{ inputs.only }}", FORCE: "${{ inputs.force }}" }
        run: |
          python3 tools/ingest/diff_manifests.py --only "$ONLY" --force "${FORCE:-false}" \
            --out stock/manifest/changed.json
          echo "sources=$(jq -c '.sources' stock/manifest/changed.json)" >> "$GITHUB_OUTPUT"
          echo "device_count=$(jq '.device_count' stock/manifest/changed.json)" >> "$GITHUB_OUTPUT"
          jq -r '"\(.device_count) repositories to fetch from \(.sources | join(", "))"' \
            stock/manifest/changed.json >> "$GITHUB_STEP_SUMMARY"

      # The refreshed manifests and the change set travel to the other jobs:
      # a job that re-read the committed manifests would fetch stale branches.
      - name: Upload manifests and change set
        uses: actions/upload-artifact@v6
        with:
          name: ingest-manifests
          path: stock/manifest/
          retention-days: 7

  fetch:
    name: Fetch ${{ matrix.source }}
    needs: discover
    if: needs.discover.outputs.device_count != '0' && needs.discover.outputs.device_count != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Only the sources that have work, straight from the change set:
        # a source added to sources.yaml needs no workflow edit.
        source: ${{ fromJson(needs.discover.outputs.sources) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@v6
        with:
          name: ingest-manifests
          path: stock/manifest/

      - name: Fetch changed repositories
        env:
          SOURCE: "${{ matrix.source }}"
          TADIPHONE_TOKEN: "${{ secrets.TADIPHONE_TOKEN }}"
        run: |
          # Exit 2 means some repositories failed; they are recorded in the state
          # and retried next run. The successful ones must still be committed.
          python3 tools/ingest/sparse_fetch.py --source "$SOURCE" \
            --only-changed stock/manifest/changed.json --jobs 12 --stage "$RUNNER_TEMP/fetched" \
            || echo "::warning::Some $SOURCE repositories could not be fetched (retried next run)."

      # Fixed layout (<rom|blobs>/<source>/<device>/, manifest/<source>.state.json),
      # only this run's repositories: tools/ingest/merge_fetch.py reads it back.
      - name: Upload fetched data
        uses: actions/upload-artifact@v6
        with:
          name: fetched-${{ matrix.source }}
          path: ${{ runner.temp }}/fetched/
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit delta and open PR
    needs: [discover, fetch]
    if: >-
      always() && needs.discover.result == 'success' &&
      needs.discover.outputs.device_count != '0' && needs.fetch.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@v6
        with:
          name: ingest-manifests
          path: stock/manifest/

      - uses: actions/download-artifact@v6
        with:
          pattern: fetched-*
          path: ${{ runner.temp }}/artifacts

      - name: Merge fetched repositories into stock/
        run: |
          python3 tools/ingest/merge_fetch.py --changed stock/manifest/changed.json \
            --artifacts "$RUNNER_TEMP/artifacts"
          rm stock/manifest/changed.json

      - name: Tests
        run: |
          python3 tests/ingest_test.py
          python3 tests/hico_evidence_parsers_test.py
          python3 tests/hico_evidence_audit_test.py
          python3 tests/hico_dependency_resolver_test.py

      - name: Open pull request
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          git add stock/manifest stock/rom stock/blobs
          if git diff --cached --quiet; then
            echo "Nothing moved upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          stamp="$(date -u +%Y-%m-%d)-run${GITHUB_RUN_NUMBER}"
          branch="stock/ingest-$stamp"
          git config user.name "hico-ingest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          summary="$(git diff --cached --stat | tail -n 1)"
          git commit -q -m "ingest($stamp): fetch delta from upstream" -m "$summary"
          git push -u origin "$branch"
          gh label create "zone:stock" --color 5319e7 --description "stock/ ingest" --force >/dev/null 2>&1 || true
          if ! gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "Stock ingest delta — $stamp" --label "zone:stock" \
              --body "Automated delta from \`ingest.yml\`: only repositories whose upstream branch moved were refetched. $summary"; then
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${{ github.event.repository.default_branch }}...$branch?expand=1"
            echo "::warning::Could not open the pull request (Settings → Actions → General → allow GitHub Actions to create pull requests). Open it here: $compare"
            echo "Delta pushed to \`$branch\`: [open the pull request]($compare)" >> "$GITHUB_STEP_SUMMARY"
          fi
