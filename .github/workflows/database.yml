name: HiCo Thermal Database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "thermal-data/**"
      - "generated-thermal/**"
      - "database/**"
      - "sources/**"
      - "tools/**"
      - ".github/workflows/database.yml"
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: hico-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify collected thermal dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build host HiCo
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Validate tools and dataset
        env:
          HICOD: build/hicod
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py tools/hico_thermal/*.py tests/*.py
          python3 tests/hico_tools_test.py
          python3 tests/thermal_scope_test.py
          python3 tests/topology_test.py
          python3 tests/database_test.py
          python3 tests/scanner_test.py
          python3 tests/thermal_table_test.py
          python3 tests/unpack_test.py
          python3 tests/workflow_regression_test.py
          python3 tests/hico_evidence_test.py
          python3 tests/hico_relationships_test.py
          python3 tools/hico_evidence.py verify --root sources/evidence
          python3 tools/hico_relationships.py
          git diff --exit-code -- sources/relationships.json
          python3 tests/hico_collector_test.py
          python3 tools/hico_collector.py verify
          python3 tools/hico_generator.py verify
          python3 tools/hico_database.py validate database
          python3 tools/hico_database.py validate database/tables
          python3 tools/gen_device_db.py --check
          python3 tools/verify_webui.py

      - name: Rebuild deterministic database in a clean directory
        run: |
          set -euo pipefail
          rm -rf build/database build/thermal-table
          python3 tools/hico_database.py build --root . --output build/database
          python3 tools/hico_database.py thermal-table --root . --output build/thermal-table
          python3 tools/hico_database.py validate build/database
          python3 tools/hico_database.py validate build/thermal-table

      - name: Upload database verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: hico-thermal-database
          path: |
            build/database/
            build/thermal-table/
          if-no-files-found: error
