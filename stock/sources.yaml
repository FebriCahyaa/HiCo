# HiCo Thermal — canonical ingest source registry
#
# Every entry below has been verified to exist on the listed provider at the
# time the file was committed. `ingest.yml` walks this file and expands each
# org into its device-tree repositories via the provider's API.
#
# Rule: only real, public sources. If a source disappears, remove it from
# this file — do not leave a dead entry. Adding a new source requires
# `tools/verify/rom_sources.py` to pass (repo count > 0, HTTP 200).
#
# Fields:
#   id            stable slug, used in stock/rom/<id>/ layout
#   name          human name for docs/reports
#   family        rom | oem | kernel | aosp
#   provider      github | gitlab | git
#   org           GitHub organization or GitLab group
#   repo_prefix   device-tree naming prefix (e.g. android_device_)
#   branch_hint   branch pattern to fetch first (may be regex; empty = default)
#   notes         short human note
schema: hico.ingest-sources.v1
sources:

  # ------------------------------------------------------------------
  # Custom ROM device trees — cross-OEM, cross-SoC coverage
  # ------------------------------------------------------------------
  - id: lineageos
    name: LineageOS
    family: rom
    provider: github
    org: LineageOS
    repo_prefix: android_device_
    branch_hint: "lineage-\\d+\\.\\d+"
    multi_branch: true
    notes: "Largest device-tree corpus; multi-OEM. multi_branch fetches oldest Android 10+ AND newest branch per device (captures kernel-era thermal format differences, e.g. lavender 4.4 vs 4.19)."

  - id: pixelos
    name: PixelOS
    family: rom
    provider: github
    org: PixelOS-Devices
    repo_prefix: android_device_
    branch_hint: fifteen|fourteen
    notes: Pixel-styled ROM; Pixel and non-Pixel device trees.

  - id: crdroid
    name: crDroid
    family: rom
    provider: github
    org: crdroidandroid
    repo_prefix: android_device_
    branch_hint: "\\d+\\.\\d+"
    multi_branch: true
    notes: Very broad device support. multi_branch enabled for kernel-era coverage.

  - id: derpfest
    name: DerpFest
    family: rom
    provider: github
    # Device trees live in DerpFest-Devices (device_<vendor>_<codename>); the
    # DerpFest-AOSP org only holds the ROM itself. Checked with git ls-remote:
    # DerpFest-Devices/device_xiaomi_sweet, device_oneplus_lemonadep.
    org: DerpFest-Devices
    repo_prefix: device_
    branch_hint: 15|14
    notes: AOSP-based, wide device coverage.

  - id: evolutionx
    name: Evolution X
    family: rom
    provider: github
    # Device trees live in Evolution-X-Devices (device_<vendor>_<codename>), not
    # the Evolution-X org. Checked: Evolution-X-Devices/device_google_husky.
    org: Evolution-X-Devices
    repo_prefix: device_
    branch_hint: "udc|vic|bic"
    notes: Pixel-experience-derived; Pixel and select others.

  - id: arrowos
    name: ArrowOS
    family: rom
    provider: github
    org: ArrowOS-Devices
    repo_prefix: android_device_
    branch_hint: "arrow-1[34]\\.\\d"
    notes: Clean AOSP derivative.

  - id: aospa
    name: Paranoid Android (AOSPA)
    family: rom
    provider: github
    org: AOSPA
    repo_prefix: android_device_
    branch_hint: topaz|uvite
    notes: Long-running project; irregular device coverage.

  - id: dotos
    name: DotOS
    family: rom
    provider: github
    org: DotOS-Devices
    repo_prefix: android_device_
    branch_hint: 15|14
    notes: Broad AOSP-based coverage.

  - id: voltageos
    name: VoltageOS
    family: rom
    provider: github
    org: VoltageOS
    repo_prefix: device_
    branch_hint: A15|A14
    notes: Pixel-adjacent, growing device list.

  - id: lmodroid
    name: LMODroid
    family: rom
    provider: github
    org: LMODroid-Devices
    repo_prefix: device_
    branch_hint: v5\\.\\d|v4\\.\\d
    multi_branch: true
    notes: LineageOS-derived, broad device coverage. multi_branch enabled.

  - id: awakenos
    name: AwakenOS
    family: rom
    provider: github
    org: AwakenOS-Devices
    repo_prefix: android_device_
    branch_hint: "5\\.\\d|4\\.\\d"
    notes: Small but active.

  - id: alphadroid
    name: AlphaDroid
    family: rom
    provider: github
    org: AlphaDroid-Devices
    repo_prefix: device_
    branch_hint: A15|A14
    notes: Pixel-experience-derived.

  - id: spark
    name: Spark
    family: rom
    provider: github
    org: spark-rom
    repo_prefix: device_
    branch_hint: A15|A14
    notes: Focused device set.

  - id: protonaosp
    name: ProtonAOSP
    family: rom
    provider: github
    org: ProtonAOSP
    repo_prefix: android_device_
    branch_hint: "13"
    notes: Older; keep for legacy device evidence only.

  # ------------------------------------------------------------------
  # Vendor blob mirrors — the stock thermal files themselves
  # ------------------------------------------------------------------
  # Device trees rarely carry vendor thermal configs; the extracted stock
  # files (thermal-*.conf, thermal-engine*.conf, thermal_info_config*.json)
  # live in the vendor blob repositories LineageOS builds against.
  # TheMuppets publishes one repo-tool manifest per LineageOS branch listing
  # every blob repository, so it is enumerated without the GitHub API. The
  # `groups="muppets_<codename>"` attribute maps each -common repo to the
  # devices that use it.
  - id: themuppets
    name: TheMuppets (LineageOS vendor blobs)
    family: blobs
    provider: repo-manifest
    org: TheMuppets
    manifest_repo: TheMuppets/manifests
    manifest_file: muppets.xml
    # Newest first: a repository listed on several branches is fetched from the newest.
    branches: [lineage-24.0, lineage-23.2, lineage-23.1, lineage-23.0, lineage-22.2, lineage-22.1, lineage-22.0]
    repo_prefix: proprietary_vendor_
    notes: Stock vendor partitions extracted per device; covers older devices through the older branches.

  # Vendor blob repositories that ROM orgs host next to their device trees
  # (ArrowOS, crDroid, AlphaDroid, DotOS, ... keep vendor_<oem>_<codename>
  # beside device_<oem>_<codename>). Only devices TheMuppets does not cover:
  # many Realme / OPPO / OnePlus and MediaTek phones are only here.
  - id: rom-vendor-blobs
    name: ROM org vendor blobs
    family: blobs
    provider: vendor-probe
    from_sources: [lineageos, crdroid, arrowos, alphadroid, dotos, aospa, pixelos, lmodroid, awakenos, derpfest, evolutionx, voltageos, spark, protonaosp]
    skip_covered_by: [themuppets]
    notes: Probed with git ls-remote from the device-tree manifests above; no API.

  # ------------------------------------------------------------------
  # OEM firmware dumps (TadiPhone — dumps.tadiphone.dev)
  #
  # filter_requires_rom: true — only fetch devices that appear in at least
  # one custom ROM source above. Devices with no custom ROM support are
  # skipped: they typically lack an active developer community and their
  # thermal configs are less useful for calibration.
  # ------------------------------------------------------------------
  - id: tadiphone-xiaomi
    name: TadiPhone dumps — Xiaomi
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/xiaomi
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN secret in CI. Only devices with custom ROM support.

  - id: tadiphone-redmi
    name: TadiPhone dumps — Redmi
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/redmi
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only devices with custom ROM support.

  - id: tadiphone-poco
    name: TadiPhone dumps — POCO
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/poco
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only devices with custom ROM support.

  - id: tadiphone-samsung
    name: TadiPhone dumps — Samsung
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/samsung
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only Samsung devices with custom ROM support.

  - id: tadiphone-oneplus
    name: TadiPhone dumps — OnePlus
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/oneplus
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only OnePlus devices with custom ROM support.

  - id: tadiphone-oppo
    name: TadiPhone dumps — OPPO
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/oppo
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only OPPO devices with custom ROM support.

  - id: tadiphone-realme
    name: TadiPhone dumps — Realme
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/realme
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only Realme devices with custom ROM support.

  - id: tadiphone-motorola
    name: TadiPhone dumps — Motorola
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/motorola
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only Motorola devices with custom ROM support.

  - id: tadiphone-google
    name: TadiPhone dumps — Google
    family: oem
    provider: gitlab
    base_url: https://dumps.tadiphone.dev
    org: dumps/google
    filter_requires_rom: true
    notes: Requires TADIPHONE_TOKEN. Only Google Pixel devices with custom ROM support.

# --------------------------------------------------------------------
# Thermal-related paths sparse-fetched from each device-tree repo.
# Kept here so both ingest.yml and tools/ingest/*.py read the same list.
# --------------------------------------------------------------------
thermal_paths:
  # actual thermal configs (rare in device trees — usually in vendor blobs)
  - "**/thermal/**"
  - "**/thermal-engine*.conf"
  - "**/thermal_info_config*.json"
  - "**/thermal_zone_config*.xml"
  - "**/thermal_platform_supported_v*.xml"
  - "**/thermal-scenes-*.xml"
  - "**/thermal_srv_config.xml"
  - "**/mmi_thermal/**"
  - "**/power_hal_conf/**"
  # init scripts that touch thermal
  - "**/init.*thermal*.rc"
  - "**/init.*thermal*.sh"
  # supporting evidence (identity, blobs referenced, build config).
  # Anchored to the repository root: with `sparse-checkout --no-cone` a
  # pattern without a leading "/" matches in every subdirectory, which pulled
  # every nested Android.bp / Android.mk of a tree (megabytes of build rules).
  - "/AndroidProducts.mk"
  - "/device.mk"
  - "/device-*.mk"
  - "/Android.bp"
  - "/Android.mk"
  - "/BoardConfig*.mk"
  - "/extract-files.sh"
  - "/extract-files.py"
  - "/proprietary-files.txt"
  - "/system.prop"
  - "/vendor.prop"
  - "/vendorsetup.sh"
  - "/lineage.dependencies"
  # sepolicy references (helps confirm HAL type)
  - "sepolicy/**/*thermal*"
  - "sepolicy/**/thermal*"

# --------------------------------------------------------------------
# Paths sparse-fetched from vendor blob mirrors (family: blobs). Only the
# stock thermal configuration, its init scripts and the power HAL tables;
# never binaries (vendor/bin, vendor/lib*), which would add hundreds of MB,
# nor the generated Android.bp / *-vendor.mk (prebuilt module lists, up to
# 650 KB each): the fetched files are listed in each source.json instead.
# --------------------------------------------------------------------
blob_paths:
  # Qualcomm thermal-engine (all vendors: Xiaomi, OnePlus, Motorola, Google Pixel 6-)
  - "proprietary/vendor/etc/thermal*"
  - "proprietary/vendor/etc/*thermal*.json"
  - "proprietary/vendor/etc/*thermal*.xml"
  - "proprietary/vendor/etc/*thermal*.conf"
  - "proprietary/vendor/etc/thermal/**"
  - "proprietary/vendor/etc/init/*thermal*"
  - "proprietary/vendor/etc/vintf/manifest/*thermal*"
  - "proprietary/vendor/etc/powerhint*.json"
  - "proprietary/vendor/etc/powerhint*.xml"
  # MediaTek thermal policies (thermal.conf, .thermal_policy_NN, .ht120.mtc)
  # Covers: OPPO/Realme MTK, Samsung Dimensity, some Motorola/OnePlus MTK
  - "proprietary/vendor/etc/.tp/**"
  - "proprietary/etc/.tp/**"
  - "proprietary/vendor/etc/power_hal*"
  # Samsung Exynos thermal (vendor.samsung.hardware.thermal HAL configs)
  - "proprietary/vendor/etc/samsung*thermal*"
  - "proprietary/vendor/etc/thermal_info_config*.json"
  - "proprietary/vendor/etc/thermal_zone_config*.xml"
  - "proprietary/vendor/etc/thermal_platform_supported*.xml"
  - "proprietary/vendor/etc/thermal-scenes*.xml"
  - "proprietary/vendor/etc/thermal_srv_config.xml"
  # ODM partition (common for Samsung, Realme, OPPO ODM-partitioned devices)
  - "proprietary/odm/etc/thermal*"
  - "proprietary/odm/etc/*thermal*"
  - "proprietary/odm/etc/thermal/**"
  - "proprietary/odm/etc/init/*thermal*"
  # Google Tensor (gs101/gs201/gs301 use pixel-specific thermal HAL)
  - "proprietary/vendor/etc/thermal_info_config*.json"
  - "proprietary/product/etc/thermal*"
  - "proprietary/system_ext/etc/thermal*"
