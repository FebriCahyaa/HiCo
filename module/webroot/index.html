<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>HiCo Thermal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-flame" /></svg></span>
        <div>
          <h1>HiCo Thermal</h1>
          <p class="sub" id="version">&nbsp;</p>
        </div>
      </div>
      <button id="lang" class="chip-btn" aria-label="Language">ID</button>
    </header>

    <main>
      <!-- ── Home ─────────────────────────────────────────────────────────── -->
      <section id="tab-home" class="tab" data-tab="home">
        <div id="flux-banner" class="banner" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
          <div>
            <strong data-i18n="flux_required"></strong>
            <p id="flux-banner-text"></p>
            <a class="btn small" id="flux-link" target="_blank" rel="noopener" data-i18n="get_flux"></a>
          </div>
        </div>

        <div id="hero" class="hero stopped">
          <div class="hero-ring" aria-hidden="true">
            <svg class="hero-icon"><use id="hero-icon" href="#i-alert" /></svg>
          </div>
          <div class="hero-text">
            <span class="hero-kicker" id="hero-kicker">&nbsp;</span>
            <h2 id="hero-title">&hellip;</h2>
            <p id="hero-desc"></p>
            <div id="hero-app" class="hero-app" hidden>
              <span class="avatar" id="hero-avatar"></span>
              <div>
                <strong id="hero-app-name"></strong>
                <span class="muted small" id="hero-app-meta"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="temps">
          <div class="gauge" id="g-cpu"></div>
          <div class="gauge" id="g-gpu"></div>
          <div class="gauge" id="g-bat"></div>
        </div>

        <div class="card">
          <div class="control">
            <div>
              <span class="control-title" data-i18n="hico_mode"></span>
              <span class="muted small" id="mode-help"></span>
            </div>
            <div class="segmented" id="seg-mode" role="radiogroup">
              <button data-value="auto" data-i18n="auto"></button>
              <button data-value="off" data-i18n="off"></button>
            </div>
          </div>
          <div class="control">
            <div>
              <span class="control-title" data-i18n="game_level"></span>
              <span class="muted small" id="level-help"></span>
            </div>
            <div class="segmented" id="seg-level" role="radiogroup">
              <button data-value="max" data-i18n="max"></button>
              <button data-value="relaxed" data-i18n="relaxed"></button>
            </div>
          </div>
        </div>

        <div class="card" id="applied-card" hidden>
          <h3 class="card-title" data-i18n="active_changes"></h3>
          <div class="facts" id="applied"></div>
        </div>

        <div class="card">
          <h3 class="card-title" data-i18n="this_device"></h3>
          <div class="facts" id="device"></div>
        </div>
      </section>

      <!-- ── Monitor ──────────────────────────────────────────────────────── -->
      <section id="tab-monitor" class="tab" data-tab="monitor" hidden>
        <div id="mon-verdict" class="verdict none">
          <div class="verdict-head">
            <span class="live"><span class="dot"></span><span id="mon-live" data-i18n="live"></span></span>
            <button class="chip-btn" id="mon-pause" data-i18n="pause"></button>
          </div>
          <h2 id="mon-title">&hellip;</h2>
          <p class="muted small" id="mon-desc"></p>
          <div class="big-stats">
            <div><span class="k" data-i18n="cpu_allowed"></span><span class="v" id="mon-cpu">–</span></div>
            <div><span class="k" data-i18n="gpu_allowed"></span><span class="v" id="mon-gpu">–</span></div>
            <div><span class="k" data-i18n="cooling_active"></span><span class="v" id="mon-cooling">–</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="chart_speed"></h3>
            <span class="legend"><i class="l-cpu"></i>CPU <i class="l-gpu"></i>GPU</span>
          </div>
          <svg class="chart" id="chart-speed" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="card-head chart-gap">
            <h3 class="card-title" data-i18n="chart_temp"></h3>
            <span class="legend"><i class="l-cpu"></i>CPU <i class="l-bat"></i><span data-i18n="battery"></span></span>
          </div>
          <svg class="chart" id="chart-temp" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <p class="muted small chart-note" data-i18n="chart_note"></p>
        </div>

        <div class="card">
          <h3 class="card-title" data-i18n="clocks"></h3>
          <div id="mon-clocks"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="cooling_devices"></h3>
            <span class="badge" id="mon-cooling-count">0</span>
          </div>
          <div id="mon-cooling-list"></div>
        </div>

        <div class="card">
          <h3 class="card-title" data-i18n="zones_title"></h3>
          <div id="mon-zones"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="events"></h3>
            <button class="link" id="mon-clear" data-i18n="clear"></button>
          </div>
          <ul class="events" id="mon-events"></ul>
        </div>
      </section>

      <!-- ── Games ────────────────────────────────────────────────────────── -->
      <section id="tab-games" class="tab" data-tab="games" hidden>
        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="flux_games"></h3>
            <span class="badge" id="games-count">0</span>
          </div>
          <p class="muted small" data-i18n="flux_games_help"></p>
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            <input id="games-search" type="search" autocapitalize="off" spellcheck="false" />
          </label>
          <ul class="apps" id="games"></ul>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="whitelist"></h3>
            <span class="badge soft-ok" data-i18n="relaxed_only"></span>
          </div>
          <p class="muted small" data-i18n="whitelist_help"></p>
          <div class="chips" id="whitelist"></div>
          <form class="add" id="whitelist-add">
            <input type="text" name="pkg" autocapitalize="off" spellcheck="false" placeholder="com.example.app" />
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="blacklist"></h3>
            <span class="badge soft-bad" data-i18n="never_boosted"></span>
          </div>
          <p class="muted small" data-i18n="blacklist_help"></p>
          <div class="chips" id="blacklist"></div>
          <form class="add" id="blacklist-add">
            <input type="text" name="pkg" autocapitalize="off" spellcheck="false" placeholder="com.example.game" />
            <button class="btn" type="submit" data-i18n="add"></button>
          </form>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="history"></h3>
            <button class="link" id="clear-sessions" data-i18n="clear"></button>
          </div>
          <div id="sessions"></div>
        </div>
      </section>

      <!-- ── Settings ─────────────────────────────────────────────────────── -->
      <section id="tab-settings" class="tab" data-tab="settings" hidden>
        <div class="card" id="settings-basic"></div>
        <details class="card advanced">
          <summary>
            <span>
              <strong data-i18n="advanced"></strong>
              <span class="muted small" data-i18n="advanced_help"></span>
            </span>
            <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
          </summary>
          <div id="settings-advanced"></div>
        </details>
        <button class="btn block ghost" id="reset-settings" data-i18n="reset_defaults"></button>
      </section>

      <!-- ── More ─────────────────────────────────────────────────────────── -->
      <section id="tab-more" class="tab" data-tab="more" hidden>
        <div class="card">
          <h3 class="card-title" data-i18n="service"></h3>
          <div class="actions">
            <button class="btn" id="restart">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg><span data-i18n="restart"></span>
            </button>
            <button class="btn danger" id="restore">
              <svg class="icon" aria-hidden="true"><use href="#i-power" /></svg><span data-i18n="restore"></span>
            </button>
          </div>
          <p class="muted small" data-i18n="restore_help"></p>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="log"></h3>
            <button class="link" id="load-log" data-i18n="refresh"></button>
          </div>
          <pre id="log"></pre>
        </div>

        <div class="card about">
          <h3 class="card-title" data-i18n="about"></h3>
          <p class="muted small" data-i18n="about_text"></p>
          <div class="links">
            <a href="https://github.com/FebriCahyaa/HiCo-Release" target="_blank" rel="noopener" data-i18n="releases"></a>
            <a href="https://github.com/FebriCahyaa/HiCo-Release/blob/main/EULA.md" target="_blank" rel="noopener">EULA</a>
            <a href="https://github.com/FebriCahyaa/Flux/releases" target="_blank" rel="noopener">Flux Tweaks</a>
          </div>
          <p class="muted small">&copy; 2026 FebriCahyaa</p>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button data-tab="home" class="active"><svg aria-hidden="true"><use href="#i-home" /></svg><span data-i18n="tab_home"></span></button>
      <button data-tab="monitor"><svg aria-hidden="true"><use href="#i-pulse" /></svg><span data-i18n="tab_monitor"></span></button>
      <button data-tab="games"><svg aria-hidden="true"><use href="#i-game" /></svg><span data-i18n="tab_games"></span></button>
      <button data-tab="settings"><svg aria-hidden="true"><use href="#i-sliders" /></svg><span data-i18n="tab_settings"></span></button>
      <button data-tab="more"><svg aria-hidden="true"><use href="#i-more" /></svg><span data-i18n="tab_more"></span></button>
    </nav>

    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Icons (inline: the WebUI works offline) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></symbol>
        <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M14 14.8V4.5a2.5 2.5 0 0 0-5 0v10.3a4.5 4.5 0 1 0 5 0z" /></symbol>
        <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z" /><path d="M2 21c0-3 1.9-5.4 5.1-6" /></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="M12 8v4M12 16h.01" /></symbol>
        <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M22 12h-4l-3 8L9 4l-3 8H2" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></symbol>
        <symbol id="i-game" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01" /><path d="M17.3 5H6.7a4 4 0 0 0-4 3.5L2 14.6a2.5 2.5 0 0 0 4.3 2L8 15h8l1.7 1.6a2.5 2.5 0 0 0 4.3-2l-.7-6.1a4 4 0 0 0-4-3.5z" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="19" cy="12" r="1.2" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8" /><path d="M21 3v5h-5" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      </defs>
    </svg>

    <script src="app.js"></script>
  </body>
</html>
