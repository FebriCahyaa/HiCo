# Reference only. database.yml generates the actual shard matrix buildspec inline.
version: 0.2
env:
  shell: bash
batch:
  fast-fail: false
  build-matrix:
    static:
      ignore-failure: false
    dynamic:
      env:
        variables:
          HICO_SHARD_ID:
            - example-shard
phases:
  build:
    commands:
      - echo "Production uses the inline buildspec generated by tools/hico_aws_batch.py"
