[BAT_SOC]
algo_type	simulated
path		/sys/class/power_supply/battery/capacity
polling		1000

[VIRTUAL-SENSOR]
algo_type	virtual
sensors		quiet_therm	battery
weight		5		3
polling		1000

[ARVR-SS-CPU7]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu7
polling		500
trig		26000
clr		25000
target		1286400

[ARVR-SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		500
trig		26000
clr		25000
target		1286400

[ARVR-MONITOR-BAT]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		battery
polling		1000
trig		36000	38000	39000	40000	41000	42000	43000	44000	46000	47000	48000	60000
clr		34000	36000	38000	39000	40000	41000	42000	43000	44000	46000	47000	48000
target		800	900	1000	1000	1006	1008	1308	1309	1410	1413	1414	1515

[ARVR-MONITOR-WIRELESS]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		wireless_charge
polling		1000
trig		40500	41900	42500	43000	43500
clr		38000	40500	41900	42500	43000
target		1	4	7	8	13

[ARVR-MONITOR-TEMP_STATE]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		temp_state
polling		1000
trig		53000
clr		48000
target		4

[ARVR-MONITOR-BCL]
algo_type	monitor
sensor		BAT_SOC
device		cpu4+hotplug_cpu6+hotplug_cpu7
polling		1000
trig		5
clr		6
target		1286400+1+1
reverse		1

[ARVR-MONITOR-GPU]
algo_type	monitor
sensor		VIRTUAL-SENSOR
device		gpu
polling		1000
trig		26000
clr		25000
target		2

[ARVR-MODEM1-PA]
algo_type       monitor
sensor          VIRTUAL-SENSOR
device          5g_modem_pa0
polling         1000
trig            47000    49000
clr             45000    47000
target          1        3

[ARVR-MODEM1-PROC]
algo_type       monitor
sensor          VIRTUAL-SENSOR
device          5g_modem_tsens
polling         1000
trig            47000    49000
clr             45000    47000
target          1        3
