# SENSOR : ALIAS

#Conf file: /vendor/etc/thermal-engine.conf

[SS-QUIET-THERMAL-S1]
algo_type ss
sampling 5000
sensor quiet-therm-adc
device cpu0
set_point 47000
set_point_clr 45000
time_constant 0
device_max_limit 1536000

[SS-QUIET-THERMAL-S2]
algo_type ss
sampling 5000
sensor quiet-therm-adc
device cpu0
set_point 53000
set_point_clr 51000
time_constant 0
device_max_limit 1036800

[SS-QUIET-THERMAL-G1]
algo_type ss
sampling 5000
sensor quiet-therm-adc
device cpu4
set_point 49000
set_point_clr 47000
time_constant 0
device_max_limit 1555200

[SS-QUIET-THERMAL-G2]
algo_type ss
sampling 5000
sensor quiet-therm-adc
device cpu4
set_point 55000
set_point_clr 53000
time_constant 0
device_max_limit 1401600

[VIRTUAL-CPU]
algo_type virtual
trip_sensor apc1-cpu0-usr
set_point 75000
set_point_clr 70000
sensors apc1-cpu0-usr apc1-cpu1-usr apc1-cpu2-usr apc1-cpu3-usr apc1-l2-usr apc1-mhm-usr
weights
sampling 100
math 2

[CPU_MONITOR]
algo_type monitor
sampling 1000
sensor VIRTUAL-CPU
thresholds 90000
thresholds_clr 85000
actions shutdown
action_info 0

[MONITOR-CPU-HOTPLUG]
algo_type monitor
sampling 5000
sensor quiet-therm-adc
thresholds 50000 54000
thresholds_clr 48000 52000
actions hotplug_6+hotplug_7 hotplug_6+hotplug_7
action_info 0+1 1+1

[BATTERY_CHARGING_STL]
algo_type monitor
sampling 5000
sensor quiet-therm-adc
thresholds 45000 47000 49000 50000 51000
thresholds_clr 43000 45000 47000 49000 50000
actions battery battery battery battery battery
action_info 1 2 3 4 5

[LCD_MONITOR]
algo_type monitor
sampling 5000
sensor backlight-therm-adc
thresholds 51000 53000 55000
thresholds_clr 50000 52000 54000
actions lcd lcd lcd
action_info 230 205 180

[LCD_MONITOR_STATE]
algo_type monitor
sampling 5000
sensor quiet-therm-adc
thresholds 62000
thresholds_clr 60000
actions lcd
action_info 30

[CPU_HOTPLUG_MONITOR]
algo_type monitor
sampling 1000
sensor quiet-therm-adc
thresholds 62000
thresholds_clr 60000
actions hotplug_1+hotplug_2+hotplug_3+hotplug_4+hotplug_5+hotplug_6
action_info 1+1+1+1+1+1

[HIGH_TEMP_STATE]
algo_type monitor
sampling 1000
sensor quiet-therm-adc
thresholds 62000
thresholds_clr 60000
actions temp_state
action_info 4
