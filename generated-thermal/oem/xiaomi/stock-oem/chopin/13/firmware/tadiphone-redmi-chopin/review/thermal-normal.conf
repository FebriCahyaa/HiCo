[BAT_SOC]
algo_type	simulated
path		/sys/class/power_supply/battery/capacity
polling		20000

[CPU_SOC]
algo_type       simulated
path            /sys/class/thermal/thermal_zone4/temp
polling         20000


[VIRTUAL_LCD-SENSOR]
algo_type       virtual
sensors         lcd_therm
weight          1000
polling         2000
weight_sum      1000
compensation    1800

[VIRTUAL-SENSOR]
algo_type   	virtual
sensors		mtktsAP		battery		mtktsbtsmdpa	mtktsbtsnrpa	charger_therm		quiet_therm
weight		-76		199		-95		477		48			416
polling		2000
weight_sum	1000
compensation	500

[SS-CPU4]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu4
polling		2000
trig		20000		44000		45000		47000		49000
clr		19000		42000		44000		46000		48000
target		2100000 	1451000 	1335000 	902000		500000

[SS-CPU7]
algo_type	ss
sensor		VIRTUAL-SENSOR
device		cpu7
polling		2000
trig		20000		44000		45000		46000		48000		49000
clr		19000		43000		44000		45000		46000		48000
target		2100000 	1745000 	1632000 	1370000		921000		500000

[MONITOR-BAT]
