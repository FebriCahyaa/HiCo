# SENSOR : ALIAS
# tsens_tz_sensor8 : gpu
# tsens_tz_sensor6 : cpu7
# tsens_tz_sensor5 : cpu6
# tsens_tz_sensor4 : cpu5
# tsens_tz_sensor3 : cpu4
# tsens_tz_sensor1 : cpu0-cpu1-cpu2-cpu3

#debug
#Conf file: /vendor/etc/thermal-engine-normal.conf

[VIRTUAL-CLUSTER1]
algo_type virtual
trip_sensor tsens_tz_sensor3
set_point 60000
set_point_clr 50000
sensors tsens_tz_sensor3 tsens_tz_sensor4 tsens_tz_sensor5 tsens_tz_sensor6 tsens_tz_sensor7 tsens_tz_sensor12
weights
sampling 10
math 2

[VIRTUAL-CLUSTER0]
algo_type virtual
trip_sensor tsens_tz_sensor1
set_point 60000
set_point_clr 50000
sensors tsens_tz_sensor1 tsens_tz_sensor2
weights
sampling 10
math 2

[LCD_MANAGEMENT]
algo_type monitor
sampling 1000
sensor backlight_therm
thresholds 48000 50000
thresholds_clr 46000 48000
actions lcd lcd
action_info 3480 3071

[BATTERY_CHARGING_CTL]
algo_type monitor
sampling 10000
sensor quiet_therm
thresholds 42000 43000 46000 47000 48000
thresholds_clr 41000 42000 44000 45000 46000
actions battery battery battery battery battery
action_info 1 2 4 5 6 

[SS-QUIET-THERM-SILVER]
disable
algo_type ss
sampling 2000
sensor quiet_therm
device cluster0
set_point 55000
set_point_clr 50000
time_constant 0
device_max_limit 1536000

